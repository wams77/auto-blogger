name: Auto Blogger Bot

on:
  schedule:
    # Berjalan setiap hari pada jam 01:00 UTC (jam 09:00 WITA pagi)
    - cron: '0 1 * * *'
  workflow_dispatch: # Mengizinkan Anda menjalankan skrip secara manual dengan tombol

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Jalankan Script Auto-Blogger
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
        run: python main.py
