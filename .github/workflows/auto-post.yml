name: Auto Blogger Bot Olahraga

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # PENTING: Memberikan izin untuk menyimpan history.txt
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Buat file Token JSON & Service Account
        env:
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
        run: |
          echo "$BLOGGER_TOKEN" > token.json

      - name: Jalankan Script Auto-Blogger
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
        run: python main.py
        
      # Menyimpan riwayat agar besok tidak ada artikel ganda
      - name: Simpan Riwayat History ke GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update riwayat postingan olahraga [skip ci]"
          git push
